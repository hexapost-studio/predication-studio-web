name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Compile TypeScript + génère les pages statiques. Ne nécessite aucune clé
      # (Supabase/LLM) : ces variables ne sont lues qu'à l'exécution des routes
      # dynamiques, jamais pendant le build.
      - name: Build
        run: npm run build

      # Aucun appel réseau (LLM, Supabase) : vérifie uniquement les fonctions pures
      # qui absorbent les formes déviantes produites par les modèles faibles.
      - name: Tests de robustesse
        run: npm test
